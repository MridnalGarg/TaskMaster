spring.application.name=TaskMaster
server.port=8080
app.base-url=http://localhost:8080

# ----------------------------------------
# POSTGRESQL DATA SOURCE CONFIGURATION
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/task_master
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver


# Enables SQL logging in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly defines the PostgreSQL dialect for query generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configurations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

# Fail startup if migrations are not valid
spring.flyway.validate-on-migrate=true

# Don't clean the database automatically
spring.flyway.clean-disabled=true

# SPRING SECURITY

logging.level.org.springframework.security=TRACE

# JWT
app.jwt.secret=3f2da28f4515d491ac4922f51f4d99b24b89280d55e513812202611a21e74f06
app.jwt.expiration-ms=7200000

app.invitation.secret=3f2da28f4515d491ac4922f51f4d99b24b89280d55e513812202611a21e74f06
app.invitation.expiration-hours=48

# Security
spring.security.user.name=disabled

# OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persistAuthorization=true

# Expose documentation endpoints
springdoc.show-actuator=false

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local attachment storage
app.attachments.storage-dir=../uploads