spring.application.name=TaskMaster
server.port=8080

# ----------------------------------------
# POSTGRESQL DATA SOURCE CONFIGURATION
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/your_db
spring.datasource.username=postgres
spring.datasource.password=you_password
spring.datasource.driver-class-name=org.postgresql.Driver


# Enables SQL logging in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly defines the PostgreSQL dialect for query generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configurations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

# Fail startup if migrations are not valid
spring.flyway.validate-on-migrate=true

# Don't clean the database automatically
spring.flyway.clean-disabled=true

# SPRING SECURITY

logging.level.org.springframework.security=TRACE

# JWT
app.jwt.secret=your_secret
app.jwt.expiration-ms=7200000

# Security
spring.security.user.name=disabled